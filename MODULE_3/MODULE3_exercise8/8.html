<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 8</title>
    <script src="8.js" defer></script>
</head>

<body>
    <h1>Task 8</h1>
    <input id="num1" type="text" placeholder="enter first integer">
    <br>
    <input id="num2" type="text" placeholder="enter second integer">
    <br>
    <select id="operation">
        <option value="add">addition</option>
        <option value="sub">subtraction</option>
        <option value="multi">multiplication</option>
        <option value="div">division</option>
    </select>
    <br>
    <button id="start">Calculate</button>
    <p id="result"></p>


<script>

       'use strict';
        document.getElementById('start').addEventListener("click", function() {

         const number2 = parseFloat(document.getElementById('num2').value);

         const num1 = parseFloat(document.getElementById('num1').value);

         const operation = document.getElementById('operation').value;

         const result = document.getElementById('result');

         if (!operation) {
           result.textContent = 'choose and operation';
         } else {
           if (isNaN(num1) || isNaN(number2)) {
             alert("write values")
           } else {
             if (operation === "add") {
               let result1 = num1 + number2;
               result.textContent = `sum is ${result1}`;
             } else if (operation === "sub") {
               let result2 = num1 - number2;
               result.textContent = `result is ${result2}`;
             } else if (operation === "multi") {
               let result3 = num1 * number2;
               result.textContent = `result is ${result3}`;
             } else {
               if (operation === "div") {
                 let result4 = num1 / number2;
                 result.textContent = `result is ${result4}`;
               }
             }
           }
         }
       })


     </script>


</body>

</html>
